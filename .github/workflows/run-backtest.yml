name: Run backtest

on:
  workflow_dispatch: {}   # manual trigger เท่านั้น — ไม่มี schedule

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: python backtest.py

      - name: Commit backtest_results.json
        run: |
          git config user.name "trading-command-center-bot"
          git config user.email "actions@github.com"
          git add backtest_results.json
          git diff --quiet --cached || git commit -m "auto: run backtest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
