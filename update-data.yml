name: Update stock data

on:
  schedule:
    # 21:30 UTC = 04:30 น. เวลาไทย (หลังตลาด US ปิด และตลาด SET ปิดไปแล้วเช่นกัน)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # ให้กดรันเองได้จากแท็บ Actions บน GitHub ด้วย ไม่ต้องรอตารางเวลา

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data fetch
        run: python fetch_data.py

      - name: Commit updated data.json
        run: |
          git config user.name "trading-command-center-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "auto: update data.json $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
